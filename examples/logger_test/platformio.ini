[platformio]
src_dir = .

; Test environments for LogInterface migration

[env:test_esp_idf_logging]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
lib_deps =
    symlink://../..

[env:test_custom_logger]
extends = env:test_esp_idf_logging
build_flags =
    -std=gnu++17
    -DUSE_CUSTOM_LOGGER
    -DWATCHDOG_DEBUG
lib_deps =
    symlink://../..
    https://github.com/packerlschupfer/ESP32-Logger.git
